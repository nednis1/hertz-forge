<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0c0c18">
<meta name="description" content="Hertz Forge playlist player — binaural beats, amplitude modulation, bilateral panning and frequency modulation.">
<title>Hertz Forge Playlist</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topbar">
  <div class="brand">Hertz Forge <small>playlist</small></div>
  <div class="topbar-actions">
    <button id="btnChainLoop" class="btn toggle" aria-pressed="false" aria-label="Loop playlists">
      <span class="full">loop</span><span class="mini" aria-hidden="true">↻</span>
    </button>
    <button id="btnChainShuffle" class="btn toggle" aria-pressed="false" aria-label="Shuffle playlists">
      <span class="full">shuffle</span><span class="mini" aria-hidden="true">⇄</span>
    </button>
    <button id="btnMenu" class="btn icon-btn" aria-haspopup="true" aria-expanded="false" aria-label="More actions">⋯</button>
  </div>
  <div id="topMenu" class="menu" hidden>
    <button id="btnAdd" class="menu-item" type="button">＋ New playlist</button>
    <button id="btnImport" class="menu-item" type="button">⇩ Load .hfc</button>
  </div>
</header>

<p class="hint">Headphones needed — each ear gets a different signal.</p>

<main id="playlists" class="playlists" aria-live="polite"></main>

<footer class="dock" id="dock" aria-label="Playback controls">
  <div class="dock-bar" aria-hidden="true"><span id="dockFill"></span></div>
  <div class="dock-line">
    <span id="dockInfo" class="dock-info" role="status" aria-live="polite">Ready</span>
    <span id="dockTime" class="dock-time"></span>
  </div>
  <div class="dock-actions">
    <button id="btnPrev" class="dock-btn" type="button" aria-label="Previous playlist" disabled>⏮</button>
    <button id="btnDockPlay" class="dock-btn go" type="button" aria-label="Play all">▶</button>
    <button id="btnNext" class="dock-btn" type="button" aria-label="Next playlist" disabled>⏭</button>
    <button id="btnVol" class="dock-btn vol" type="button" aria-label="Volume" aria-expanded="false">🔊 <span id="volLabel">50%</span></button>
  </div>
  <div id="volPop" class="vol-pop" hidden>
    <label for="vol">Volume</label>
    <input id="vol" type="range" min="0" max="100" step="1" value="50">
    <output id="volOut" for="vol">50%</output>
  </div>
</footer>

<input id="fileInput" type="file" accept=".hfc,application/json" multiple hidden>

<script src="js/dsp-core.js"></script>
<script src="js/model.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
